<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background: #16213e;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 320px;
        }

        .display {
            background: #0f3460;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            text-align: right;
        }

        .display .expression {
            color: #a0b4c8;
            font-size: 14px;
            min-height: 20px;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .display .result {
            color: #e94560;
            font-size: 36px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .display .result.error {
            color: #ff6b6b;
            font-size: 18px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            padding: 18px 0;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-number {
            background: #1a1a4e;
            color: #e0e0e0;
        }

        .btn-number:hover {
            background: #252560;
        }

        .btn-operator {
            background: #533483;
            color: #ffffff;
        }

        .btn-operator:hover {
            background: #6a43a3;
        }

        .btn-operator.active {
            background: #e94560;
        }

        .btn-equals {
            background: #e94560;
            color: #ffffff;
        }

        .btn-equals:hover {
            background: #ff5575;
        }

        .btn-clear {
            background: #c0392b;
            color: #ffffff;
        }

        .btn-clear:hover {
            background: #e04030;
        }

        .btn-zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button class="btn-clear" onclick="clearAll()">C</button>
            <button class="btn-operator" onclick="toggleSign()">+/-</button>
            <button class="btn-operator" onclick="percentage()">%</button>
            <button class="btn-operator" id="op-/" onclick="setOperator('/')">÷</button>

            <button class="btn-number" onclick="appendDigit('7')">7</button>
            <button class="btn-number" onclick="appendDigit('8')">8</button>
            <button class="btn-number" onclick="appendDigit('9')">9</button>
            <button class="btn-operator" id="op-*" onclick="setOperator('*')">×</button>

            <button class="btn-number" onclick="appendDigit('4')">4</button>
            <button class="btn-number" onclick="appendDigit('5')">5</button>
            <button class="btn-number" onclick="appendDigit('6')">6</button>
            <button class="btn-operator" id="op--" onclick="setOperator('-')">−</button>

            <button class="btn-number" onclick="appendDigit('1')">1</button>
            <button class="btn-number" onclick="appendDigit('2')">2</button>
            <button class="btn-number" onclick="appendDigit('3')">3</button>
            <button class="btn-operator" id="op-+" onclick="setOperator('+')">+</button>

            <button class="btn-number btn-zero" onclick="appendDigit('0')">0</button>
            <button class="btn-number" onclick="appendDecimal()">.</button>
            <button class="btn-equals" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldReset = false;

        function updateDisplay(value, expr) {
            const resultEl = document.getElementById('result');
            const exprEl = document.getElementById('expression');
            resultEl.textContent = value;
            resultEl.classList.remove('error');
            if (expr !== undefined) {
                exprEl.textContent = expr;
            }
        }

        function showError(msg) {
            const resultEl = document.getElementById('result');
            resultEl.textContent = msg;
            resultEl.classList.add('error');
            document.getElementById('expression').textContent = '';
        }

        function clearAll() {
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldReset = false;
            highlightOperator(null);
            updateDisplay('0', '');
        }

        function appendDigit(digit) {
            if (shouldReset) {
                currentInput = digit;
                shouldReset = false;
            } else {
                currentInput = currentInput === '0' ? digit : currentInput + digit;
            }
            updateDisplay(currentInput);
        }

        function appendDecimal() {
            if (shouldReset) {
                currentInput = '0.';
                shouldReset = false;
            } else if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay(currentInput);
        }

        function toggleSign() {
            if (currentInput !== '0') {
                currentInput = currentInput.startsWith('-')
                    ? currentInput.slice(1)
                    : '-' + currentInput;
                updateDisplay(currentInput);
            }
        }

        function percentage() {
            currentInput = String(parseFloat(currentInput) / 100);
            updateDisplay(currentInput);
        }

        function setOperator(op) {
            if (operator && !shouldReset) {
                compute(true);
            }
            previousInput = currentInput;
            operator = op;
            shouldReset = true;
            highlightOperator(op);
            const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
            updateDisplay(currentInput, previousInput + ' ' + opSymbols[op]);
        }

        function highlightOperator(op) {
            ['+', '-', '*', '/'].forEach(o => {
                const btn = document.getElementById('op-' + o);
                if (btn) btn.classList.toggle('active', o === op);
            });
        }

        function compute(chainedCall) {
            if (!operator || !previousInput) return;
            const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
            const expr = previousInput + ' ' + opSymbols[operator] + ' ' + currentInput + ' =';

            fetch('/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    num1: parseFloat(previousInput),
                    operator: operator,
                    num2: parseFloat(currentInput)
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    showError(data.error);
                    operator = null;
                    previousInput = '';
                    shouldReset = true;
                } else {
                    currentInput = String(data.result);
                    if (!chainedCall) {
                        operator = null;
                        previousInput = '';
                        highlightOperator(null);
                        updateDisplay(currentInput, expr);
                    } else {
                        updateDisplay(currentInput);
                    }
                    shouldReset = true;
                }
            })
            .catch(() => showError('Error'));
        }
    </script>
</body>
</html>
